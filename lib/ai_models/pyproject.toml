[project]
name = "ai-models"
version = "0.1.0"
description = "Models for the skills through Pydantic-AI, set per task in config.yaml"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai,google]>=2.66",
    "pyyaml>=6",
    "certifi>=2024.0.0",
    # filelock: the local-model lock (local.hold_lock)
    "filelock>=3.12",
    "plugin-settings",
]

[project.optional-dependencies]
# local images, music and video in process; only skills that need it install torch.
# av: MP4 encoding of video clips with their audio (diffusers.utils.encode_video), and the LTX-2
# image-to-video pipeline re-encodes its conditioning image as H.264; sentencepiece, protobuf: transformers
# reads a T5 tokenizer (`spiece.model`, LTX-Video) with them; transformers 5 parses it with protobuf 7.36 gencode;
# torchvision: transformers' Qwen-VL processors (a Qwen-VL text encoder, Qwen-Image); psutil: available system memory
# before a load (local.py); torchao: int8 weight-only quantization of the components a model's `quantize` names (local.py)
diffusers = [
    "torch>=2.9",
    "torchvision",
    "diffusers>=0.43",
    "transformers>=5",
    "accelerate",
    "sentencepiece",
    "protobuf>=7.36",
    "av",
    "psutil",
    "torchao>=0.17",
]
# Kokoro speech on the CPU (kokoro.py)
kokoro = [
    "kokoro-onnx>=0.6.1,<0.7",
    "numpy",
]
# Chatterbox Turbo speech on the CPU (chatterbox.py): chatterbox-tts pins torch 2.6, transformers 5.2.0,
# diffusers 0.29 and numpy 1, and runs on the versions of the diffusers extra; a project that installs it overrides
# those pins (media:voiceover's pyproject.toml). resemble-perth (its watermark) imports pkg_resources, which
# setuptools 81 removes.
chatterbox = [
    "chatterbox-tts==0.1.7",
    "soundfile",
    "setuptools<81",
]
# forced alignment (align.py): torchaudio 2.11, its last release, keeps forced_align
align = [
    "torch>=2.9",
    "torchaudio==2.11.*",
    "numpy",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_models"]
