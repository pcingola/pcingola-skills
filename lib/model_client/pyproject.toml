[project]
name = "model-client"
version = "0.1.0"
description = "A command-line client of a model server at a URL"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.3",
    "pyyaml>=6",
    # the default URL's port (model_server.port of config.yaml)
    "plugin-settings",
]

[project.scripts]
model-client = "model_client.client:main"

[tool.uv.sources]
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_client"]
