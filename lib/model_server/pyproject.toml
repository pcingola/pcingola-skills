[project]
name = "model-server"
version = "0.1.0"
description = "An OpenAI-compatible server of the local models of config.yaml, with Ollama behind it"
requires-python = ">=3.11"
dependencies = [
    "ai-models",
    "plugin-settings",
    # request and response types of the endpoints (openai.types)
    "openai>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # multipart requests (images/edits, videos, audio/alignments)
    "python-multipart>=0.0.9",
    # forwarding to Ollama
    "httpx>=0.28",
    # free memory of the CPU kinds
    "psutil",
]

[project.scripts]
# The command-line client of a server at a URL (model_server.client)
model-client = "model_server.client:main"

[project.optional-dependencies]
# The extras of ai-models, one per local runtime the server runs in process
diffusers = ["ai-models[diffusers]"]
kokoro = ["ai-models[kokoro]"]
chatterbox = ["ai-models[chatterbox]"]
# av: the uploaded audio of /v1/audio/alignments is decoded with PyAV (ai_models.local.read_audio)
align = ["ai-models[align]", "av"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_server"]
