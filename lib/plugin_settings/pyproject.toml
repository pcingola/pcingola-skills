[project]
name = "plugin-settings"
version = "0.1.0"
description = "Plugin data directory and the settings file config.yaml for the skills of every plugin"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugin_settings"]
