# The settings file of the unit and integration tests: the tiny models that tests load or call.
# In-process tests name it with `config.use(TEST_CONFIG)`; child processes get it in SKILLS_CONFIG
# (tests/settings_env.py). No remote provider, no api_key. Weights of the kokoro, chatterbox and torchaudio
# providers go under ~/.cache/pcingola-skills-tests/; diffusers models use the default Hugging Face
# cache. Tests read a copy with `~` expanded to the real home (settings_env.TEST_CONFIG), so child
# processes, whose HOME is temporary, share these directories. Every local provider has `test: true`: its
# models are test models, which a model server of this file lists as such (`model-client models --tests`).
huggingface:
  home: ~/.cache/huggingface
providers:
  ollama:
    kind: ollama
  diffusers:
    kind: diffusers
    test: true
    models:
      # Random weights, the FLUX.2 klein pipeline classes.
      klein-tiny:
        repo: optimum-intel-internal-testing/tiny-random-flux.2-klein
        steps: 2
        guidance: 1.0
        inpaint: Flux2KleinInpaintPipeline
        # Small images keep the image-gen and video-effects tests fast.
        image: {max_edge: 512, min_edge: 256}
      # Random weights, the LTX-Video 0.9.5 pipeline class.
      ltx-tiny:
        repo: optimum-intel-internal-testing/tiny-random-ltx-video-0.9.5
        pipeline: LTXImageToVideoPipeline
        steps: 2
        guidance: 3.0
        fps: 24
        size_multiple: 32
        frame_step: 8
        width: 128
        height: 96
        max_frames: 9
      # Random weights, the LTX-2 pipeline classes: video with a sound track (stereo, 24 kHz vocoder).
      ltx2-tiny:
        repo: optimum-intel-internal-testing/tiny-random-ltx2
        pipeline: LTX2ImageToVideoPipeline
        steps: 2
        guidance: 3.0
        fps: 24
        size_multiple: 32
        frame_step: 8
        width: 128
        height: 96
        max_frames: 9
      # Random weights, the ACE-Step pipeline classes: noise at 48 kHz. A folder that the session fixture of
      # tests/integration/music writes with tests/tiny_ace_step.py when it is missing.
      ace-step-tiny:
        repo: ~/.cache/pcingola-skills-tests/tiny-ace-step
        steps: 2
        guidance: 1.0
        duration_arg: audio_duration
        lyrics_arg: lyrics
      # Random weights, the Kandinsky S2V modular pipeline of the diffusers tests. Its text RoPE has
      # 128 positions, so the prompt is short.
      s2v-tiny:
        repo: kandinskylab/tiny-kandinsky-s2v-distilled-modular-pipe
        pipeline: KandinskyS2VDistilledModularPipeline
        steps: 2
        fps: 25
        buckets: [[64, 64], [64, 96], [96, 64]]
        audio_rate: 16000
        output: videos
        args: {prompt: A person speaks.}
  kokoro:
    kind: kokoro
    test: true
    dir: ~/.cache/pcingola-skills-tests/kokoro
    models:
      kokoro-v1.0-int8:
        model_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
        voices_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
        langs: {af_: en-us, am_: en-us, bf_: en-gb, bm_: en-gb}
        voice: af_heart
  # Chatterbox Turbo, the smallest Chatterbox model (350M), on the CPU; not a task: tests name it by kind.
  chatterbox:
    kind: chatterbox
    test: true
    dir: ~/.cache/pcingola-skills-tests/chatterbox
    models:
      chatterbox-turbo:
        url: https://www.modelscope.cn/models/ResembleAI/chatterbox-turbo/resolve/master
        files: [t3_turbo_v1.safetensors, s3gen_meanflow.safetensors, ve.safetensors, conds.pt, vocab.json, merges.txt, tokenizer_config.json, added_tokens.json, special_tokens_map.json]
  # Random weights, the Drama 3 classes of fish-speech (NVIDIA GPU only); not a task: tests name it by kind. A
  # folder that the session fixture of tests/integration/ai_models writes with tests/tiny_fish.py when it is
  # missing. It never ends on its own, so every request runs to `max_frames` (32 frames, 1.5 s).
  fish:
    kind: fish
    test: true
    models:
      drama-3-tiny:
        repo: ~/.cache/pcingola-skills-tests/tiny-fish
        memory: 6
        max_frames: 32
  torchaudio:
    kind: torchaudio
    test: true
    dir: ~/.cache/pcingola-skills-tests/torchaudio
    models:
      MMS_FA:
        url: https://dl.fbaipublicfiles.com/mms/torchaudio/ctc_alignment_mling_uroman/model.pt
tasks:
  chat: ollama:gemma3:270m
  system1: ollama:laya:421m-english-bf16
  embed: ollama:all-minilm:22m
  # The Q4_K_M build by its full tag: `lfm3-audio` resolves to an MLX nvfp4 build on macOS, which answers no
  # structured output, and to this build elsewhere.
  audio: ollama:lfm3-audio:2b-q4_K_M
  image: diffusers:klein-tiny
  image_best: diffusers:klein-tiny
  image_edit: diffusers:klein-tiny
  image_multi_ref: diffusers:klein-tiny
  video: diffusers:ltx-tiny
  presenter: diffusers:s2v-tiny
  music: diffusers:ace-step-tiny
  speech: kokoro:kokoro-v1.0-int8
  align: torchaudio:MMS_FA
# A test waits at most this long for another process that holds the local models, below the 25 s
# subprocess and 30 s test timeouts, so a held lock fails the test with the holder's PID.
local_models:
  lock_wait: 20
