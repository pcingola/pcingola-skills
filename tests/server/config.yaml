# The client settings of tests/server/, the tests of a deployed model server (lib/model_server), which only
# `scripts/tests.sh server --server-url <url>` runs. `server_config` of tests/server/conftest.py writes this file
# to a temporary directory with `providers.server.base_url` set to the URL of `--server-url` (the server's /v1),
# so this file has no base_url and is not a valid settings file by itself.
#
# The models are the server's tiny models: the providers of tests/config.yaml in the server's config under the
# names test_<provider>, and the Ollama models of tests/config.yaml pulled on the server's Ollama, whose ids are
# ollama:<tag> (the server's provider of kind ollama is named ollama; docs/model_server.md, Tests). An entry
# holds no attribute: the client reads them from GET /v1/models/{id}.
providers:
  server:
    kind: openai
    # Every tiny model the suite calls, by the server's model id.
    models:
      "test_diffusers:klein-tiny":
      "test_diffusers:ltx-tiny":
      "test_diffusers:ltx2-tiny":
      "test_diffusers:ace-step-tiny":
      "test_diffusers:s2v-tiny":
      "test_kokoro:kokoro-v1.0-int8":
      "test_chatterbox:chatterbox-turbo":
      "test_fish:drama-3-tiny":
      "test_torchaudio:MMS_FA":
      "ollama:gemma3:270m":
      "ollama:laya:421m-english-bf16":
      "ollama:all-minilm:22m":
      "ollama:lfm3-audio:2b-q4_K_M":
tasks:
  chat: server:ollama:gemma3:270m
  system1: server:ollama:laya:421m-english-bf16
  embed: server:ollama:all-minilm:22m
  audio: server:ollama:lfm3-audio:2b-q4_K_M
  image: server:test_diffusers:klein-tiny
  image_edit: server:test_diffusers:klein-tiny
  video: server:test_diffusers:ltx-tiny
  presenter: server:test_diffusers:s2v-tiny
  music: server:test_diffusers:ace-step-tiny
  speech: server:test_kokoro:kokoro-v1.0-int8
  align: server:test_torchaudio:MMS_FA
