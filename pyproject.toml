[project]
name = "skills"
version = "0.1.0"
description = "Test environment of the skills marketplace"
readme = "README.md"
requires-python = ">=3.12.2,<3.14"
dependencies = []

# One environment for every test suite: lib/ from this directory and the dependencies of every skill project
# (plugins/*/skills/*/scripts/pyproject.toml, plugins/studio/server/pyproject.toml). Manim runs in its own
# environment, as a subprocess (plugins/media/skills/short-video/scripts/manim).
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4",
    # lib/
    "ai-models[diffusers]",
    "plugin-settings",
    "psutil",
    # brand, style
    "pyyaml>=6",
    "python-pptx>=1.0",
    "numpy>=2",
    # voiceover
    "httpx>=0.28",
    # pptx, second-opinion
    "Pillow>=10.1",
    # pptx, brand (also through python-pptx)
    "lxml>=5.0",
    # music
    "librosa>=0.11",
    # short-video particle-text (woff2 through brotli)
    "fonttools>=4.50",
    "brotli>=1.1",
    # video-effects, short-video screencast
    "opencv-python-headless>=4.10",
    # short-video and studio integration tests
    "playwright==1.64.1",
    # voiceover
    "kokoro-onnx>=0.6.1,<0.7",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "torchvision==0.26.*",
    "num2words",
    "soundfile",
    "chatterbox-tts==0.1.7",
    "setuptools<81",
    "fish-speech; sys_platform == 'linux'",
    "torchcodec>=0.17; sys_platform == 'linux'",
]

# chatterbox-tts pins older torch, transformers, diffusers, numpy and safetensors; fish-speech's dependencies pin
# protobuf below 3.20; the same overrides and fish-speech metadata as media:voiceover's pyproject.toml
[tool.uv]
override-dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "transformers==5.22.2",
    "diffusers==0.43.0",
    "numpy==2.4.4",
    "safetensors==0.8.0",
    "protobuf>=6.31.1",
]
dependency-metadata = [
    { name = "fish-speech", version = "3.0.0", requires-dist = [
        "numpy", "torch", "torchaudio", "transformers", "hydra-core>=1.3.2", "natsort>=8.4.0", "einops>=0.7.0",
        "librosa>=0.10.1", "kui>=1.6.0", "uvicorn>=0.30.0", "loguru>=0.6.0", "pyrootutils>=1.0.4", "resampy>=0.4.3",
        "einx[torch]==0.2.2", "pydub", "modelscope==1.17.1", "opencc-python-reimplemented==0.1.7", "silero-vad",
        "ormsgpack", "tiktoken>=0.8.0", "pydantic", "cachetools", "descript-audio-codec", "safetensors", "tokenizers",
        "soundfile>=0.12.1",
    ] },
]

[tool.uv.sources]
ai-models = { path = "lib/ai_models", editable = true }
plugin-settings = { path = "lib/plugin_settings", editable = true }
fish-speech = { git = "https://github.com/fishaudio/fish-speech", rev = "0f8a12e8a651062fdee9c33a894bdccd3a8513f1" }
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# Every test has a timeout (seconds); a tests/models/ test sets a larger one of its own
timeout = 30
# unit and integration only: tests/models/ runs only when named (scripts/tests.sh models)
testpaths = ["tests/unit", "tests/integration"]
# The skill packages (<skill>_tool) and the studio server, importable by every suite
pythonpath = [
    "plugins/ai/skills/classify/scripts",
    "plugins/ai/skills/second-opinion/scripts",
    "plugins/brand/skills/brand/scripts",
    "plugins/brand/skills/style/scripts",
    "plugins/docs/skills/pptx/scripts",
    "plugins/docs/skills/revealjs-slideshow/scripts",
    "plugins/media/skills/image-gen/scripts",
    "plugins/media/skills/music/scripts",
    "plugins/media/skills/short-video/scripts",
    "plugins/media/skills/video-effects/scripts",
    "plugins/media/skills/voiceover/scripts",
    "plugins/studio/server",
]
