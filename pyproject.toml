[project]
name = "skills"
version = "0.1.0"
description = "Test environment of the skills marketplace"
readme = "README.md"
requires-python = ">=3.12.2,<3.14"
dependencies = []

# One environment for every test suite: lib/ from this directory and the dependencies of every skill project
# (plugins/*/skills/*/scripts/pyproject.toml, plugins/studio/server/pyproject.toml). Manim runs in its own
# environment, as a subprocess (plugins/media/skills/short-video/scripts/manim).
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # lib/
    "ai-models[diffusers]",
    "plugin-settings",
    # brand, style
    "pyyaml>=6",
    "python-pptx>=1.0",
    "numpy>=2",
    # voiceover
    "httpx>=0.28",
    # pptx, second-opinion
    "Pillow>=10.1",
    # pptx, brand (also through python-pptx)
    "lxml>=5.0",
    # music
    "librosa>=0.11",
    # video-effects
    "opencv-python-headless>=4.10",
    # voiceover
    "kokoro-onnx>=0.6.1,<0.7",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "torchvision==0.26.*",
    "num2words",
    "chatterbox-tts==0.1.7",
    "soundfile",
    "setuptools<81",
]

[tool.uv]
# chatterbox-tts pins exact versions. It runs on torch 2.11 (torchaudio's last release, needed by the MMS_FA
# aligner) and its torchvision 0.26, numpy 2 (needed by kokoro-onnx), and the diffusers, transformers and safetensors of lib/'s diffusers extra.
# Its demo UI and its Chinese and Japanese tokenisers are not needed.
override-dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "torchvision==0.26.*",
    "numpy>=2",
    "diffusers>=0.42",
    "transformers>=5",
    "safetensors>=0.8",
    "gradio; sys_platform == 'never'",
    "spacy-pkuseg; sys_platform == 'never'",
    "pykakasi; sys_platform == 'never'",
]

[tool.uv.sources]
ai-models = { path = "lib/ai_models", editable = true }
plugin-settings = { path = "lib/plugin_settings", editable = true }
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# The skill packages (<skill>_tool) and the studio server, importable by every suite
pythonpath = [
    "plugins/ai/skills/classify/scripts",
    "plugins/ai/skills/second-opinion/scripts",
    "plugins/brand/skills/brand/scripts",
    "plugins/brand/skills/style/scripts",
    "plugins/docs/skills/pptx/scripts",
    "plugins/docs/skills/revealjs-slideshow/scripts",
    "plugins/media/skills/image-gen/scripts",
    "plugins/media/skills/music/scripts",
    "plugins/media/skills/short-video/scripts",
    "plugins/media/skills/video-effects/scripts",
    "plugins/media/skills/voiceover/scripts",
    "plugins/studio/server",
]
