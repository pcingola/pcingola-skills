requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "plugin-settings",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }
