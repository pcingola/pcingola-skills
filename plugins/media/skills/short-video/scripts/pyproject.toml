[project]
name = "short-video-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    # particle-text: glyph outlines from font files (brotli decodes woff2), texture and samples with Pillow
    "fonttools>=4.50",
    "brotli>=1.1",
    "Pillow>=10.1",
    # screencast: frames, warps, masks and alignment (labels with Pillow)
    "opencv-python-headless>=4.10",
    # the video model of video scenes (`Engine: video`) through the ai_models config (lib/ai_models, git source)
    "ai-models",
    # the settings file config.yaml (lib/plugin_settings, git source)
    "plugin-settings",
]

[project.optional-dependencies]
# local diffusers video models in process (torch, diffusers)
local = ["ai-models[diffusers]"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
ai-models = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/ai_models", branch = "main" }
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }
