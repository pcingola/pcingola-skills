<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #000; }
  #root { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden;
          font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Blurred, darkened cover copy behind the image, so non-16:9 images are
     neither cropped nor letterboxed with black. */
  #bg-fill { background: url("__BACKGROUND__") center / cover no-repeat;
             filter: blur(40px) brightness(0.45); transform: scale(1.1); }
  #bg-image { object-fit: contain; }
  /* Overlays (labels, arrows, highlights) go below, driven by the timeline.
     Overlays fixed to the picture go inside #anchored, which the camera
     moves with #bg-image. */
</style>
</head>
<body>
<div id="root" data-composition-id="__SCENE_ID__" data-start="0" data-duration="__DURATION__"
     data-full-length data-width="__WIDTH__" data-height="__HEIGHT__" data-fps="__FPS__">
  <div id="bg-fill" class="clip bg" data-start="0" data-duration="__DURATION__" data-full-length
       data-track-index="0"></div>
  <img id="bg-image" class="clip bg" src="__BACKGROUND__" alt="" data-start="0" data-duration="__DURATION__"
       data-full-length data-track-index="1" />
  <!-- overlays here -->
  <div id="anchored" class="bg"></div>
</div>
<script>
  // Times come from timing.js: S(n) / SE(n) = start / end of sentence n,
  // W(n, "word", k) / WE(n, "word", k) = start / end of the k-th "word" in sentence n.
  // Something moves the whole time, in step with the sentences: one camera
  // move per sentence on ["#bg-image", "#anchored"], plus what is drawn,
  // flows or counts on each word (references/scenes.md, "Movement").
  const tl = gsap.timeline({ paused: true });
  // Example, a camera move during sentence n onto a point of the picture:
  // tl.fromTo(["#bg-image", "#anchored"], { scale: 1.05, xPercent: 0, yPercent: 0 },
  //           { scale: 1.35, xPercent: 8, yPercent: -4, transformOrigin: "50% 50%",
  //             duration: S(n + 1) - S(n), ease: "sine.inOut" }, S(n));
  window.__timelines = window.__timelines || {};
  window.__timelines["__SCENE_ID__"] = tl;
</script>
</body>
</html>
