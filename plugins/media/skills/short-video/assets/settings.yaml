# Every value short-video uses that is not part of the code's logic lives
# here. `init` copies this file into the project as settings.yaml; edit that
# copy to change a film. Every command reads the project's copy over these
# defaults.

# The film's creator(s), joined with ", ": the title byline, the end scene's
# credit line, the caption and the MP4 tags.
author: []

video:
  width: 1920
  height: 1080
  fps: 30

contact_sheet:
  fps: 1          # frames per second of scene time
  width: 384      # px per frame
  columns: 5      # frames per row

# HyperFrames render quality (`hyperframes render -q`).
render:
  quality: looks

# Encoding of scene and film files.
encode:
  video_codec: libx264
  pixel_format: yuv420p
  crf: 18
  audio_codec: aac
  audio_bitrate: 192k
  channel_layout: stereo

# Spoken form of written words the voices misread: written word -> what the
# voice is given, e.g. {"ACME-AI": "Acme A I", "acme-ai.com": "Acme A I dot com"}.
# Keys are single words, matched case-sensitively, the longest key first.
# `script` writes the spoken form; `voice` stores the written form, the
# spoken words merged into one timing word, so the page keys to the written word.
pronounce: {}

# Narration voice: the voice of every sentence without a named speaker,
# passed to the voiceover skill. model: a speech model id <provider>:<model>
# of config.yaml (the voiceover skill's `routes` lists them); null = its
# `speech` model. name: null = the model's default voice; the voice voiceover
# resolved is the one recorded in timing.json. speed: other than 1.0 only for
# a model with a speed setting. style: delivery instructions, only for a model
# that takes them; null = none. The voiceover skill refuses a speed or style
# the model does not take. speaker_gap: seconds of silence at a speaker
# change inside a scene (0.35 s is the voiceover skill's gap between
# sentences).
voice:
  model: null
  name: null
  speed: 1.0
  style: null
  speaker_gap: 0.35
  speed_min: 0.5
  speed_max: 2.0

# preview_width: width of the image preview in storyboard.md; a percentage of
# the editor or preview pane. image_scene_id: id of the n-th image scene `init` writes.
storyboard:
  preview_width: 30%
  image_scene_id: "scene_{n}"

# `validate` estimates the film length from the narration word count, plus
# each clip scene without narration (its imported clip, else clip_seconds),
# and warns outside this range; there is no other limit.
length:
  words_per_second: 2.5
  clip_seconds: 6
  min_seconds: 60
  max_seconds: 180

# Scenes drawn from a suggested page `assets/<name>.html` (`Template: <name>`
# in the storyboard). position (first / last / any) and max_rows are
# suggestions: `validate` warns when a scene does not follow them.
# show_author: false = the page shows the author itself, so the post-production
# caption skips it (absent: true). A scene's own `Show author:` overrides it. hold_seconds: how long the scene runs past its narration.
templates:
  title:
    position: first
    max_rows: 3
    show_author: false
    hold_seconds: 0
  summary:
    position: any
    max_rows: 4
    show_author: true
    hold_seconds: 0
  end:
    position: last
    max_rows: 2
    show_author: false
    hold_seconds: 4.0

# Post-production creator credit (see references/post-production.md).
# text: null = no caption text and no end credit line; with a brand, the logo
# alone in the corner of every scene, title and end included. byline: null =
# no byline on the title scene. The MP4 tags are written either way.
credit:
  text: "Created by {author}"      # the caption, and the end scene's credit line; null = none
  byline: "by {author}"            # under the title on the title scene; null = none
  copyright: "© {year} {author}"
  font: Helvetica
  cap_height: 0.717         # cap height of `font` as a fraction of font_size (places the brand logo)
  font_size: h/40           # FFmpeg expression, h = frame height
  min_font_size: 8          # pixels; FFmpeg 9 drawtext fails on every glyph of macOS Helvetica.ttc below 8 px
  margin: h/24              # from the right and bottom edges
  dark_text: black@0.5      # on a light corner
  light_text: white@0.6     # on a dark corner
  light_background_luma: 128  # mean luma (0-255) at or above which the corner counts as light
  corner: [0.6, 0.86, 0.4, 0.14]  # region measured for brightness: x, y, w, h as fractions of the frame (text null: around the logo)
  samples_per_scene: 3      # frames measured per scene in `assemble`
  samples_per_video: 5      # frames measured over the whole video in `credit`

# Brand name for the logo beside the caption and on the title and end scenes;
# null = no logo.
brand: null

mix:
  sample_rate: 48000
  loudness_i: -16.0         # LUFS
  loudness_tp: -1.5         # dBTP
  loudness_lra: 11.0
  music_db: -14.0           # music gain before ducking; lower it if the voice is hard to hear
  # A video scene's own sound track (the video model's), mixed under its narration: its integrated loudness is set
  # ambience_relative_db LU from the narration's (negative: below), with at most ambience_max_gain_db of gain so a
  # near-silent track is not raised into noise, and faded in and out over ambience_fade seconds.
  ambience_relative_db: -15.0
  ambience_max_gain_db: 10.0
  ambience_fade: 0.5
  fade_in: 1.0
  fade_out: 3.0
  duck: "sidechaincompress=threshold=0.02:ratio=10:attack=15:release=350"

# Background music: a track made with the music skill, or given by the user,
# as a path relative to the project; `music` imports it as the next version.
# null: the film has the voice only. `length` prints the music length to
# request: the narration plus extra_seconds.
music:
  file: null
  extra_seconds: 5

# Critics. The film critic is a non-Claude model run through
# ai:second-opinion on the assembled MP4 with its sound: the model of task
# film_critic of the ai_models config.yaml. A project's settings.yaml may set
# model: a model id <provider>:<model> of that file in its place, or null to
# turn the film critic off. Only a Gemini model of a provider of kind google
# takes video. rounds: review-and-fix rounds of the film critic, each
# ending in one assembly. max_findings: the most findings the film critic
# reports per round. scene_max_findings: the most problems the stills critic
# reports in its one review of an HTML scene (references/scene-critic.md).
critic:
  rounds: 1
  max_findings: 5
  scene_max_findings: 5

# `play` opens files with these applications (macOS `open -a`): images
# (.png, .jpg, .jpeg, .webp, .gif) with image_app, video and audio with app.
# On Linux `play` opens each file with `xdg-open` and ignores these.
play:
  app: VLC
  image_app: Preview

# Projects are never created at or under this path; null allows any path.
forbidden_project_root: null

# Scenes with `Engine: manim` in the storyboard: a Manim Community Edition
# `scene.py` (from assets/manim_scene.py), rendered at the `video:` size and fps.
# scene_class: the Scene subclass `render` renders.
# length_tolerance_frames: how far, in frames, the rendered video may be from
# the narration length; the scene ends with `self.finish()` to meet it.
# verbosity: Manim's log level (`manim render -v`).
# background_color: the starting page's background colour (a constant at the top of scene.py).
manim:
  scene_class: Main
  length_tolerance_frames: 1
  verbosity: WARNING
  background_color: "#0b1320"

# `screencast --shots FILE`: screen recordings and screenshots composed into a
# clip for an `Engine: clip` scene (references/screencast.md). A shot list's
# `style:` is merged over this section. Colours are #RRGGBB or a palette name;
# sizes are px of the output frame. palette: accent (highlights, clicks, labels
# by default), mark (drawn boxes and loops), divider (wipes) are required; add
# any other names. background: a diagonal gradient from colors[0] (top left)
# to colors[1] (bottom right); glows: soft lights drifting around x, y
# (fractions of the frame), radius a fraction of the width; particles: rising
# dots (0 = none). panel: corner radius (page px), shadow strength, a glow of
# ambient_color around the panel, edge_light on its rim. label: font file
# (TrueType or OpenType; null = Pillow's built-in font), size, pill fill and
# text colours. caption: captions sit in a band `height` px tall at the bottom,
# darkened to band_color over `ramp` px on panel shots when the list has a
# caption. focal: perspective focal length in frame widths. safe_margin:
# labels stay this far from every frame edge (title-safe). fade: crossfade
# seconds between shots (0 = hard cuts). crf: quality of the clip written
# (`clip` re-encodes it at `encode.crf`).
screencast:
  palette:
    accent: "#4C9AFF"
    accent2: "#A78BFA"
    accent3: "#F59E0B"
    mark: "#EF4444"
    divider: "#FACC15"
    white: "#F2F4F7"
  background:
    colors: ["#101318", "#1E232D"]
    glows: []
    particles: 0
    particle_color: white
  panel:
    radius: 22
    shadow: 0.75
    ambient_color: white
    ambient: 0.06
    edge_light: 0.25
  label:
    font: null
    size: 46
    fill: "#0E1116"
    fill_opacity: 0.84
    outline_opacity: 0.24
    text: "#ECEFF3"
  caption:
    band: true
    band_color: "#0B0D12"
    band_opacity: 0.93
    height: 175
    ramp: 55
    size: 46
    align: left
  focal: 1.25
  vignette: 0.28
  safe_margin: 90
  fade: 0.3
  crf: 14
