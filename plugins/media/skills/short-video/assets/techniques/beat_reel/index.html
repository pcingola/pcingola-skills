<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="kit/beat.js"></script>
<style>
  :root {
    --bg: #070b16;
    --ink: #f5efe6;
    --muted: rgba(245, 239, 230, 0.72);
    --acc-1: #ff8a3d;       /* word glows, one per shot in turn; the frame and the rule */
    --acc-2: #4fd8ff;
    --acc-3: #8e7cff;
    --acc-4: #ffc46b;
    --flash: #ffffff;
    --font: Inter, "Helvetica Neue", Arial, sans-serif;
    --font-word: "Barlow", Inter, "Helvetica Neue", Arial, sans-serif;
    --font-cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--ink); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #bg-fill { background: linear-gradient(160deg, var(--bg) 0%, #101a3a 100%); }

  /* placeholder shots standing in for the footage; replaced by <video id="bg-video"> (note.md) */
  #shots { overflow: hidden; }
  .shot { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
  .shot > div { position: absolute; }
  .shot .sun { width: 300px; height: 300px; border-radius: 50%; filter: blur(2px); }
  .shot .ridge { left: -200px; width: 2320px; }
  .shot .rays { inset: -200px; opacity: 0.1; mix-blend-mode: screen; }
  .shot .chip { right: 150px; top: 130px; font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.12em;
                padding: 6px 12px; border: 2px solid rgba(245, 239, 230, 0.45); border-radius: 8px; color: var(--muted); }

  #vignette { background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 50%, rgba(7, 11, 22, 0.6) 100%); }
  #title-shade { opacity: 0;   /* behind the closing title: darkens the whole frame, most at the centre */
                  background: radial-gradient(ellipse 45% 32% at 50% 50%, rgba(7, 11, 22, 0.7), rgba(7, 11, 22, 0.4) 100%); }
  #sweep { position: absolute; left: 0; top: -200px; width: 90px; height: 1480px; opacity: 0; mix-blend-mode: screen;
           transform: rotate(18deg); filter: blur(6px);
           background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5) 40%, rgba(255, 255, 255, 0.9) 50%,
                       rgba(255, 255, 255, 0.5) 60%, transparent); }
  #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  #frame rect { fill: none; stroke: var(--ink); stroke-width: 2.5;
                filter: drop-shadow(0 0 6px var(--acc-2)) drop-shadow(0 0 16px var(--acc-2)); }

  /* one word per shot, in the shot's open band (top or bottom); built from WORDS */
  .word { position: absolute; left: 0; width: 1920px; height: 280px; display: flex; align-items: center;
          justify-content: center; opacity: 0; }
  .word.top { top: 100px; }
  .word.bottom { top: 700px; }
  .word span { display: block; font-family: var(--font-word); font-weight: 800; font-size: 200px; line-height: 1;
               letter-spacing: 0.06em; padding-left: 0.06em; text-transform: uppercase; color: var(--ink);
               filter: drop-shadow(0 0 2px rgba(7, 11, 22, 0.9)) drop-shadow(0 0 26px var(--glow)); }

  /* the closing title on the last cut */
  #final { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center;
           justify-content: center; opacity: 0; }
  #final span { font-family: var(--font-word); font-weight: 800; font-size: 240px; line-height: 1; letter-spacing: 0.1em;
                padding-left: 0.1em; text-transform: uppercase; color: var(--ink);
                filter: drop-shadow(0 0 30px var(--acc-1)) drop-shadow(0 0 80px var(--acc-2)); }
  #final .ch { display: inline-block; font-style: normal; }
  #final-rule { position: absolute; left: 660px; top: 680px; width: 600px; height: 4px; border-radius: 2px;
                transform-origin: 50% 50%;
                background: linear-gradient(90deg, transparent, var(--acc-1) 15%, var(--acc-4) 50%, var(--acc-2) 85%, transparent); }
  #final-sub { position: absolute; left: 0; top: 708px; width: 1920px; text-align: center; opacity: 0;
               font-family: var(--font-cond); font-weight: 700; font-size: 40px; letter-spacing: 0.34em;
               padding-left: 0.34em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 18px rgba(7, 11, 22, 0.9); }
  #flash { background: var(--flash); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="beat_reel" data-start="0" data-duration="9.5"
     data-full-length data-width="1920" data-height="1080" data-fps="30">
  <div id="bg-fill" class="clip bg" data-start="0" data-duration="9.5" data-full-length data-track-index="0"></div>
  <div id="shots" class="bg"></div>
  <div id="anchored" class="bg"></div>
  <!-- overlays fixed to the frame here -->
  <div id="vignette" class="layer"></div>
  <div id="sweep"></div>
  <div id="title-shade" class="layer"></div>
  <div id="parts" class="layer"></div>
  <svg id="frame" viewBox="0 0 1920 1080"><rect id="fr" x="44" y="27" width="1832" height="1026" rx="6" pathLength="1000"/></svg>
  <div id="words"></div>
  <div id="final"><span></span></div>
  <div id="final-rule"></div>
  <div id="final-sub"></div>
  <div id="wipe" class="layer"></div>
  <div id="slices" class="layer"></div>
  <div id="flash" class="layer"></div>
</div>
<script>
  // Beat reel. Shots cut on a beat grid, SHOT_BEATS beats each; at every cut a slice wipe sweeps across, a
  // chromatic slice jolts the picture for four frames and a white flash frame lands on the cut. One kinetic word
  // per shot stamps in on the cut in the shot's open band; a thin frame tightens on every beat inside a shot and
  // springs open on the cut; the shot pushes in 1.0 to 1.06. The last cut lands a title that holds. Particles
  // drift over everything. The placeholder shots are drawn panels that move like footage; over real footage
  // they are replaced by background.mp4 cut on the same beats (note.md).
  const BPM = 120;                      // tempo of the music (note.md, Music)
  const OFFSET = 0;                     // scene time of the music's first beat in this scene, in [0, 60 / BPM)
  const SHOT_BEATS = 4;                 // beats per shot in the default cuts (2 s at 120 bpm)
  const WORDS = ["First", "Second", "Third", "Fourth"];      // one per shot
  const BANDS = ["top", "bottom", "bottom", "top"];           // each shot's open band, where its word sits
  const TITLE = "Reel";                 // lands on the last cut
  const SUBTITLE = "Cut on the beat";
  const STAGE = "#shots";               // the footage element: punch-in and slice jolt (#bg-video over footage)
  const FW = 1920, FH = 1080, FPS = 30;

  const D = +document.getElementById("root").dataset.duration;      // scene length (storyboard Length, or the narration)

  const grid = Kit.beat.grid(BPM, { offset: OFFSET });
  // Cut times: the start of each word shot, then the title's cut. Default: every SHOT_BEATS beats (0, 2, 4, 6, 8).
  // Any increasing times work: literal times, or grid.snap(W(n, "word")) in a narrated scene (note.md).
  const CUT_TIMES = [...WORDS, TITLE].map((w, k) => grid.at(k * SHOT_BEATS));
  const CUTS = CUT_TIMES.slice(0, -1);                               // word shots
  const LAST = CUT_TIMES[CUT_TIMES.length - 1];                      // the title's cut; the title holds to D
  const ACC = ["--acc-1", "--acc-2", "--acc-3", "--acc-4"];
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const starts = CUT_TIMES, ends = [...CUT_TIMES.slice(1), D];     // each shot's window, the title shot last

  // ---- placeholder shots (delete from here to "end of placeholder shots" over real footage) ----
  // Placeholder shots: a sky gradient, a sun, two ridges in parallax and light rays, from a seeded generator;
  // the ridges sit opposite the shot's open band so the word has a clear field. Inside its window each shot
  // pans like a camera move on footage.
  const rand = Kit.beat.rand(23);
  const SKIES = [["#1b2a5e", "#e0784a"], ["#0d3b4f", "#7fd3c8"], ["#2b1d4f", "#c86a9a"], ["#3a2a12", "#f2b45a"], ["#0b1630", "#5a7bd8"]];
  const shotsEl = document.getElementById("shots");
  function ridge(bottom, h, color, rnd) {
    let pts = "0% 100%";
    for (let i = 0; i <= 12; i++) pts += `, ${(i * 100 / 12).toFixed(1)}% ${(15 + rnd() * 60).toFixed(1)}%`;
    pts += ", 100% 100%";
    const d = document.createElement("div");
    d.className = "ridge";
    d.style.cssText = `${bottom ? "bottom:-20px" : "top:-20px"};height:${h}px;background:${color};` +
      `clip-path:polygon(${pts});${bottom ? "" : "transform:scaleY(-1);filter:blur(8px)"}`;   // on top: a cloud bank
    return d;
  }
  const shots = [...WORDS, TITLE].map((w, k) => {
    const s = document.createElement("div"), sky = SKIES[k % SKIES.length], low = BANDS[k] !== "bottom";
    s.className = "shot";
    s.style.background = `linear-gradient(${low ? 180 : 0}deg, ${sky[0]} 0%, ${sky[1]} 100%)`;
    const sun = document.createElement("div");
    sun.className = "sun";
    sun.style.cssText = `left:${(400 + rand() * 1100).toFixed(0)}px;top:${low ? 520 : 260}px;` +
      `background:radial-gradient(circle, #fff6e0 0%, ${sky[1]} 55%, transparent 72%)`;
    const rays = document.createElement("div");
    rays.className = "rays";
    rays.style.background = `repeating-linear-gradient(${(70 + rand() * 40).toFixed(0)}deg, rgba(255,255,255,0.5) 0 18px, transparent 18px 90px)`;
    const far = ridge(low, 420, "rgba(7, 11, 22, 0.55)", rand), near = ridge(low, 260, "rgba(7, 11, 22, 0.92)", rand);
    const chip = document.createElement("div");
    chip.className = "chip"; chip.textContent = k < WORDS.length ? "CLIP " + String(k + 1).padStart(2, "0") : "END";
    s.append(rays, sun, far, near, chip);
    shotsEl.appendChild(s);
    return { el: s, sun, rays, far, near, dir: k % 2 ? -1 : 1 };
  });
  function drawShots(t) {
    shots.forEach((s, k) => {
      const on = t >= starts[k] && t < ends[k] || (k === shots.length - 1 && t >= D);
      s.el.style.visibility = on ? "visible" : "hidden";
      if (!on) return;
      const u = (t - starts[k]) / (ends[k] - starts[k]);
      const flip = BANDS[k] === "bottom" ? " scaleY(-1)" : "";
      s.far.style.transform = `translateX(${(s.dir * -90 * u).toFixed(1)}px)` + flip;
      s.near.style.transform = `translateX(${(s.dir * -260 * u).toFixed(1)}px)` + flip;
      s.sun.style.transform = `translate(${(s.dir * -40 * u).toFixed(1)}px, ${(-60 * u).toFixed(1)}px)`;
      s.rays.style.transform = `rotate(${(s.dir * 6 * u).toFixed(2)}deg)`;
    });
  }
  // ---- end of placeholder shots ----

  // Particles over the whole frame, driven by the clock.
  const parts = Kit.beat.particles("#parts", { n: 36, seed: 9, colors: [css("--acc-1"), css("--acc-2"), css("--ink"), css("--acc-4")] });

  // Words, one per shot, in its open band; the glow takes the shot's accent.
  const wordsEl = document.getElementById("words");
  const wordEls = WORDS.map((w, k) => {
    const d = document.createElement("div");
    d.className = "word " + BANDS[k];
    d.style.setProperty("--glow", `var(${ACC[k % ACC.length]})`);
    d.innerHTML = `<span>${w}</span>`;
    wordsEl.appendChild(d);
    return d;
  });
  document.querySelector("#final span").innerHTML = [...TITLE].map((c) => `<i class="ch">${c}</i>`).join("");
  document.getElementById("final-sub").textContent = SUBTITLE;

  const tl = gsap.timeline({ paused: true });
  const clock = { t: 0 };
  function draw(t) {
    drawShots(t);   // placeholder shots only
    parts(t);
  }
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => draw(clock.t) }, 0);

  // The frame draws on, tightens on each beat inside a shot and springs open on the cut.
  const fr = document.getElementById("fr");
  const setFrame = (m, t, d, ease) => tl.to(fr, { attr: { x: m, y: m * 0.62, width: FW - 2 * m, height: FH - 2 * m * 0.62 }, duration: d, ease }, t);
  tl.fromTo(fr, { attr: { "stroke-dasharray": "550 450" } }, { attr: { "stroke-dasharray": "1000 0" }, duration: 0.45, ease: "power2.out" }, 0);
  // Beats strictly inside each word shot (from the grid), so uneven cuts get as many tightenings as they hold.
  const inner = CUTS.map((c, k) => grid.list(c + 0.05, ends[k] - 0.05));
  CUTS.forEach((c, k) => {
    inner[k].forEach((b, j) => {
      setFrame(44 + Math.min(j + 1, 4) * 16, b, 0.22, "power3.out");
      tl.fromTo(fr, { attr: { "stroke-width": 5 } }, { attr: { "stroke-width": 2.5 }, duration: 0.4, ease: "power2.out", immediateRender: false }, b);
    });
    if (ends[k] < LAST) setFrame(44, ends[k], 0.12, "power2.out");
  });
  setFrame(100, LAST, 0.3, "power3.out");

  // Punch-in 1.0 to 1.06 over each shot, and a light sweep across it on its middle inner beat.
  const sweep = (t) => {
    tl.fromTo("#sweep", { x: -700, opacity: 0.8 }, { x: FW + 380, opacity: 0.8, duration: 0.35, ease: "power1.inOut", immediateRender: false }, t);
    tl.set("#sweep", { opacity: 0 }, t + 0.36);
  };
  starts.forEach((t0, k) => {
    tl.fromTo(STAGE, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.06, duration: ends[k] - t0, ease: "sine.out", immediateRender: k === 0 }, t0);
    if (k < CUTS.length && inner[k].length) sweep(inner[k][Math.floor(inner[k].length / 2)]);
  });

  // Each cut after the first: slice wipe, chromatic slice on the footage, white flash frame.
  CUT_TIMES.slice(1).forEach((t, i) => {
    Kit.beat.wipe(tl, "#wipe", t, { dir: i % 2 ? -1 : 1, edges: [css("--acc-2"), css("--acc-1")], fill: css("--bg") });
    Kit.beat.slice(tl, "#slices", t, { seed: 41 + i * 5, target: STAGE, fps: FPS });
    Kit.beat.flash(tl, "#flash", t, { fps: FPS });
  });

  // Words stamp in on their cut and are gone just before the next one.
  wordEls.forEach((w, k) => Kit.beat.stamp(tl, w, CUTS[k], { until: ends[k] - 0.03 }));

  // The title lands on the last cut, its letters closing in; the rule draws and the subtitle rises. The title
  // shade darkens the footage behind it. A hold over 2 s keeps moving: the title grows with the hold's length, the
  // rule and subtitle enter later (half the hold, at most 2 s after the cut) and a light sweep crosses every 4 beats.
  tl.fromTo("#title-shade", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, LAST - 0.1);
  const HOLD = D - LAST;
  Kit.beat.stamp(tl, "#final", LAST, { until: D, keep: true, from: 2.4, dur: 0.2, shake: 8, grow: 1 + 0.02 * Math.max(2, HOLD) });
  if (HOLD > 2) grid.list(LAST + 1.5, D - 0.5, 4).forEach(sweep);
  const chs = document.querySelectorAll("#final .ch");
  chs.forEach((c, i) => tl.fromTo(c, { x: (i - (chs.length - 1) / 2) * -26 }, { x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, LAST + 0.05));
  const SUB = HOLD > 2 ? LAST + Math.min(HOLD / 2, 2) : LAST + 0.1;
  tl.fromTo("#final-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, SUB);
  tl.fromTo("#final-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, SUB + 0.05);
  tl.set({}, {}, D);

  draw(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["beat_reel"] = tl;
</script>
</body>
</html>
