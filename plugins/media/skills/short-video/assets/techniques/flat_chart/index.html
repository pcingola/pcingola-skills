<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="d3.min.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --text: #e8ecf4;
    --muted: #5a6478;       /* bars before the accent, grid, axis, source */
    --accent: #ff8a3d;      /* the one bar the headline is about */
    --font: Inter, "Helvetica Neue", Arial, sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--text); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg-fill { background: var(--bg); }
  #label { position: absolute; left: 120px; top: 72px; font-size: 36px; letter-spacing: 0.12em; text-transform: uppercase;
           color: var(--muted); opacity: 0; }
  #headline { position: absolute; left: 120px; top: 126px; width: 1680px; font-size: 56px; font-weight: 700; line-height: 1.15; opacity: 0; }
  #chart { position: absolute; left: 120px; top: 250px; width: 1680px; height: 700px; }
  #chart text { font-family: var(--font); }
  #source { position: absolute; left: 120px; bottom: 60px; font-size: 24px; color: var(--muted); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="flat_chart" data-start="0" data-duration="7"
     data-full-length data-width="1920" data-height="1080" data-fps="30">
  <div id="bg-fill" class="clip bg" data-start="0" data-duration="7" data-full-length data-track-index="0"></div>
  <div id="anchored" class="bg">
    <svg id="chart" width="1680" height="700" viewBox="0 0 1680 700"></svg>
  </div>
  <!-- overlays fixed to the frame here -->
  <div id="label">Sequencing cost per human genome</div>
  <div id="headline">The cost fell by five orders of magnitude in two decades</div>
  <div id="source">Source: NHGRI Genome Sequencing Program, rounded</div>
</div>
<script>
  // A flat d3 chart built by GSAP. Label and headline first, then grid, then each bar grows from its baseline in
  // reading order with its value after it lands, then the accent bar and the source line under a slow flat push.
  const DATA = [
    { label: "2001", value: 95000000 }, { label: "2005", value: 14000000 }, { label: "2008", value: 1300000 },
    { label: "2011", value: 10000 }, { label: "2015", value: 1300 }, { label: "2022", value: 500 }
  ];
  const ACCENT = DATA.length - 1;            // the bar the headline is about
  const UNIT = "US dollars, log scale";
  const FW = 1680, FH = 700, padL = 190, padR = 20, padT = 50, base = FH - 70;  // not `top`: a global `top` collides with window.top

  const money = (v) => v >= 1e6 ? "$" + (v / 1e6).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "M" : "$" + v.toLocaleString("en-US");
  const x = d3.scaleBand().domain(DATA.map((d) => d.label)).range([padL, FW - padR]).padding(0.32);
  const y = d3.scaleLog().domain([100, 1e9]).range([base, padT]);
  const svg = d3.select("#chart");

  const ticks = [100, 1e4, 1e6, 1e8];
  const grid = svg.append("g").attr("id", "grid");
  grid.selectAll("line").data(ticks).join("line").attr("id", (d, i) => "grid-" + i)
    .attr("x1", padL).attr("x2", FW - padR).attr("y1", (d) => y(d)).attr("y2", (d) => y(d))
    .style("stroke", "var(--muted)").style("stroke-opacity", 0.35).attr("stroke-width", 1);
  grid.selectAll("text").data(ticks).join("text").attr("id", (d, i) => "tick-" + i)
    .attr("x", padL - 20).attr("y", (d) => y(d) + 9).attr("text-anchor", "end").attr("font-size", 26)
    .style("fill", "var(--muted)").text(money);
  grid.append("text").attr("id", "unit").attr("transform", "translate(50," + (base + padT) / 2 + ") rotate(-90)")
    .attr("text-anchor", "middle").attr("font-size", 26).style("fill", "var(--muted)").text(UNIT);
  grid.append("line").attr("id", "axis").attr("x1", padL).attr("x2", FW - padR).attr("y1", base).attr("y2", base)
    .style("stroke", "var(--muted)").attr("stroke-width", 2);

  // Each bar grows from its baseline (attr y and height); the accent bar has a second rect in the accent colour on top.
  const bars = svg.selectAll("g.bar").data(DATA).join("g").attr("class", "bar").attr("id", (d, i) => "bar-" + i);
  bars.append("rect").attr("id", (d, i) => "bar-rect-" + i)
    .attr("x", (d) => x(d.label)).attr("width", x.bandwidth()).attr("y", (d) => y(d.value)).attr("height", (d) => base - y(d.value))
    .style("fill", "var(--muted)");
  svg.select("#bar-" + ACCENT).append("rect").attr("id", "bar-accent")
    .attr("x", x(DATA[ACCENT].label)).attr("width", x.bandwidth()).attr("y", y(DATA[ACCENT].value))
    .attr("height", base - y(DATA[ACCENT].value)).style("fill", "var(--accent)").style("opacity", 0);
  svg.selectAll("text.value").data(DATA).join("text").attr("class", "value").attr("id", (d, i) => "value-" + i)
    .attr("x", (d) => x(d.label) + x.bandwidth() / 2).attr("y", (d) => y(d.value) - 16).attr("text-anchor", "middle")
    .attr("font-size", 36).attr("font-weight", 700).style("fill", "var(--text)").style("opacity", 0).text((d) => money(d.value));
  svg.selectAll("text.cat").data(DATA).join("text").attr("class", "cat").attr("id", (d, i) => "cat-" + i)
    .attr("x", (d) => x(d.label) + x.bandwidth() / 2).attr("y", base + 46).attr("text-anchor", "middle")
    .attr("font-size", 30).style("fill", "var(--text)").style("opacity", 0).text((d) => d.label);

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
  tl.fromTo("#headline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
  tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.8);
  DATA.forEach((d, i) => {
    const at = 1.3 + i * 0.25;
    tl.fromTo("#cat-" + i, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
    tl.from("#bar-" + i + " rect", { attr: { y: base, height: 0 }, duration: 0.6, ease: "power2.out" }, at);
    tl.fromTo("#value-" + i, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at + 0.6);
  });
  const landed = 1.3 + ACCENT * 0.25 + 1.0;
  tl.to("#bar-accent", { opacity: 1, duration: 0.6, ease: "power2.out" }, landed);
  tl.to(DATA.map((d, i) => i === ACCENT ? null : "#bar-rect-" + i).filter(Boolean), { opacity: 0.6, duration: 0.6, ease: "power2.out" }, landed);
  tl.fromTo("#source", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, landed + 0.5);
  // The hold: a flat push on #anchored toward the accent bar, from the accent to 0.5 s before the end, so no
  // stretch is still over about 2 s. The origin keeps every label inside the 60 px margin at scale 1.1.
  tl.fromTo("#anchored", { scale: 1 }, { scale: 1.1, transformOrigin: "1100px 880px", duration: 7 - 0.5 - landed,
            ease: "sine.inOut" }, landed);
  window.__timelines = window.__timelines || {};
  window.__timelines["flat_chart"] = tl;
</script>
</body>
</html>
