<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="three.min.js"></script>
<script src="kit/camera.js"></script>
<script src="kit/glow.js"></script>
<script src="kit/shadow.js"></script>
<script src="kit/tiltshift.js"></script>
<style>
  :root {
    --bg: #dfe7e5;          /* sky and fog */
    --ground: #e9ece4;
    --block: #f4f3ee;
    --mark: #0f8ca0;        /* glowing points in the scene */
    --accent: #f9a200;      /* the number and the bar fill */
    --card-bg: rgba(251, 251, 251, 0.96);
    --track: #e3e1da;
    --text: #111111;
    --muted: #5b6670;
    --font: "Barlow", Inter, "Helvetica Neue", Arial, sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--text); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg-fill { background: var(--bg); }
  #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #card { position: absolute; left: 50%; top: 50%; width: 820px; margin-left: -410px; margin-top: -230px;
          padding: 48px 60px 54px; background: var(--card-bg); border-radius: 14px; border-top: 8px solid var(--accent);
          box-shadow: 0 24px 60px rgba(0,0,0,0.18); opacity: 0; }
  #num { font-family: var(--font-num); font-size: 168px; font-weight: 700; line-height: 0.95; color: var(--accent);
         font-variant-numeric: tabular-nums; }
  #caption { font-size: 40px; font-weight: 500; margin-top: 14px; line-height: 1.25; }
  #caption span { display: inline-block; opacity: 0; }
  #track { position: relative; height: 18px; border-radius: 9px; background: var(--track); margin-top: 40px; overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--accent); border-radius: 9px;
          transform-origin: 0 50%; }
  #share { font-size: 30px; color: var(--muted); margin-top: 14px; opacity: 0; }
  #share b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div id="root" data-composition-id="data_card_3d" data-start="0" data-duration="7"
     data-full-length data-width="1920" data-height="1080" data-fps="30">
  <div id="bg-fill" class="clip bg" data-start="0" data-duration="7" data-full-length data-track-index="0"></div>
  <div id="anchored" class="bg">
    <canvas id="gl" width="1920" height="1080"></canvas>
  </div>
  <!-- overlays fixed to the frame here -->
  <div id="card">
    <div id="num">0</div>
    <div id="caption"><span>times</span> <span>a</span> <span>rider</span> <span>found</span> <span>an</span> <span>empty</span> <span>dock</span></div>
    <div id="track"><div id="fill"></div></div>
    <div id="share"><b id="pct">0%</b> on the hill</div>
  </div>
</div>
<script>
  // A data card over a 3D scene. The 3D world keeps moving under the card (a slow orbit with tilt-shift) and
  // dims a little while the card is up; the card builds in reading order: number counting, caption word by
  // word, bar fill with its share. One clock tween drives draw(t).
  const D = 7, FW = 1920, FH = 1080;
  const VALUE = 4200, SHARE = 71;
  const css = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const C = (k) => new THREE.Color(css(k));
  let seed = 3;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(FW, FH, false);
  const scene = new THREE.Scene();
  scene.background = C("--bg");
  scene.fog = new THREE.Fog(C("--bg"), 24, 55);
  const camera = new THREE.PerspectiveCamera(32, FW / FH, 0.5, 120);
  const light = Kit.lights(scene, renderer, { sky: 0xffffff, ground: 0xb8b2a4, fill: 0.75, intensity: 0.55, elevation: 45, azimuth: -40, extent: 16 });

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: C("--ground") }));
  ground.receiveShadow = true;
  scene.add(ground);
  const P = 1.2, N = 10, boxes = [], marks = [];
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
      const h = 0.15 + rand() * rand() * (Math.abs(i) + Math.abs(j) < 5 ? 2.0 : 0.6);
      boxes.push([i * P + (a - 0.5) * 0.42, h, j * P + (b - 0.5) * 0.42]);
    }
    if (rand() < 0.12) marks.push([(i + 0.5) * P, 0.1, (j + 0.5) * P]);
  }
  const city = new THREE.InstancedMesh(new THREE.BoxGeometry(0.36, 1, 0.36), new THREE.MeshLambertMaterial({ color: C("--block") }), boxes.length);
  const m = new THREE.Matrix4();
  boxes.forEach((b, k) => { m.makeScale(1, b[1], 1).setPosition(b[0], b[1] / 2, b[2]); city.setMatrixAt(k, m); });
  Kit.shadows(city, true, true);
  scene.add(city);
  const glows = Kit.glowPoints(marks, { color: C("--mark"), size: 2.4, opacity: 1 });
  scene.add(glows);

  // Camera: a slow orbit (yaw 0 to 24 degrees) with a small push, high enough that the card covers the centre only.
  const cam = Kit.camera.path([
    { t: 0, tx: 0, ty: 0, tz: 0, d: 22, pitch: 50, yaw: -6 },
    { t: 7, d: 19, pitch: 46, yaw: 18, ease: "sineInOut" }
  ]);
  const post = Kit.tiltShift(renderer, { tilt: 1, band: [0.4, 0.62], edge: [1.2, 1.2], vignette: 0.6 });

  const dim = { v: 0 };
  function draw(t) {
    cam.apply(camera, t);
    glows.material.opacity = Kit.pulse(t, 2, 0.7, 1);
    post.set({ vignette: 0.6 + dim.v * 0.6, tilt: 1 + dim.v * 0.5 });
    post.render(scene, camera);
  }

  const tl = gsap.timeline({ paused: true });
  const clock = { t: 0 };
  tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => draw(clock.t) }, 0);
  tl.to(dim, { v: 1, duration: 0.8, ease: "power1.inOut" }, 0.6);
  tl.fromTo("#card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.8);
  const n = { v: 0 };
  tl.to(n, { v: VALUE, duration: 1.8, ease: "power2.out", onUpdate: () => {
    document.getElementById("num").textContent = Math.round(n.v).toLocaleString("en-US");
  } }, 1.1);
  tl.to("#caption span", { opacity: 1, duration: 0.3, stagger: 0.12, ease: "power2.out" }, 1.6);
  tl.fromTo("#fill", { scaleX: 0 }, { scaleX: SHARE / 100, duration: 1.4, ease: "power2.out" }, 3.0);
  tl.to("#share", { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.0);
  const pct = { v: 0 };
  tl.to(pct, { v: SHARE, duration: 1.4, ease: "power2.out", onUpdate: () => {
    document.getElementById("pct").textContent = Math.round(pct.v) + "%";
  } }, 3.0);
  draw(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["data_card_3d"] = tl;
</script>
</body>
</html>
