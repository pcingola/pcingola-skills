<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #0b1320; }
  #root { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden;
          font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* A scene without a picture: a flat colour or gradient in the film's palette
     (a placeholder; restyle it to match the film). */
  #bg-fill { background: radial-gradient(ellipse at 30% 20%, #1f3a5f 0%, #0b1320 70%); }
  /* Everything on screen is drawn in the page (diagram, chart, map, text) inside
     #anchored, the full-frame layer the camera moves. */
</style>
</head>
<body>
<div id="root" data-composition-id="__SCENE_ID__" data-start="0" data-duration="__DURATION__"
     data-full-length data-width="__WIDTH__" data-height="__HEIGHT__" data-fps="__FPS__">
  <div id="bg-fill" class="clip bg" data-start="0" data-duration="__DURATION__" data-full-length
       data-track-index="0"></div>
  <div id="anchored" class="bg">
    <!-- drawn elements here -->
  </div>
  <!-- overlays fixed to the frame here -->
</div>
<script>
  // Times come from timing.js: S(n) / SE(n) = start / end of sentence n,
  // W(n, "word", k) / WE(n, "word", k) = start / end of the k-th "word" in sentence n.
  // Something moves the whole time, in step with the sentences: the drawing is
  // built part by part with the speech, and the camera moves on "#anchored"
  // to the part each sentence names (references/scenes.md, "Movement").
  const tl = gsap.timeline({ paused: true });
  // Example, a camera move during sentence n onto a part of the drawing:
  // tl.fromTo("#anchored", { scale: 1, xPercent: 0, yPercent: 0 },
  //           { scale: 1.3, xPercent: 8, yPercent: -4, transformOrigin: "50% 50%",
  //             duration: S(n + 1) - S(n), ease: "sine.inOut" }, S(n));
  window.__timelines = window.__timelines || {};
  window.__timelines["__SCENE_ID__"] = tl;
</script>
</body>
</html>
