# Chatterbox Turbo for the speech models of provider kind `chatterbox`, a separate uv project because
# chatterbox-tts pins torch 2.6, which the voiceover environment cannot hold. `voiceover setup --chatterbox` syncs
# it into its own environment outside the plugin directory (see voiceover_tool/config.py); ai_models runs its
# worker with that environment's python (the provider's `python`).
[project]
name = "voiceover-chatterbox"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chatterbox-tts==0.1.7",
    # the reference length check and the WAV the worker writes
    "soundfile",
    # resemble-perth (the watermark) imports pkg_resources, removed in setuptools 81
    "setuptools<81",
]

[tool.uv]
package = false
