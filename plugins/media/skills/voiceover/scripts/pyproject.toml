[project]
name = "voiceover-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro-onnx>=0.6.1,<0.7",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "numpy",
    "num2words",
    # weight downloads
    "httpx>=0.27.0",
    # the local-model lock and free memory of ai_models.local (speech models of kind vllm-omni)
    "psutil",
    # speech backend: the speech model of the ai_models config (lib/ai_models, git source)
    "ai-models",
    # the settings file config.yaml (lib/plugin_settings, git source)
    "plugin-settings",
    # chatterbox backend (Chatterbox-Turbo); its pins are overridden below
    "chatterbox-tts==0.1.7",
    "soundfile",
    # resemble-perth (the watermark) imports pkg_resources, removed in setuptools 81
    "setuptools<81",
]

[tool.uv]
# chatterbox-tts pins torch 2.6 and numpy<2; it runs on torch 2.11 (torchaudio's
# last release, needed by the MMS_FA aligner) and numpy 2 (needed by kokoro-onnx). gradio (its demo UI)
# and the Chinese/Japanese tokenisers of its multilingual model are not needed.
override-dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "numpy>=2",
    "gradio; sys_platform == 'never'",
    "spacy-pkuseg; sys_platform == 'never'",
    "pykakasi; sys_platform == 'never'",
]

[tool.uv.sources]
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
ai-models = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/ai_models", branch = "main" }
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
]
