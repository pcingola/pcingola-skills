[project]
name = "voiceover-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # the speech and align models of the ai_models config (lib/ai_models, git source): Kokoro and the torchaudio
    # aligner run in this process
    "ai-models[kokoro,align]",
    # resampling a speech model's answer to 24 kHz; torchaudio 2.11 is the release the align extra pins
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "numpy",
    "num2words",
    # the local-model lock and free memory of ai_models.local (speech models of kind vllm-omni)
    "psutil",
    # the settings file config.yaml (lib/plugin_settings, git source)
    "plugin-settings",
    # the length of a reference recording (add-voice)
    "soundfile",
]

[tool.uv.sources]
# CUDA 13.0 builds on Linux (aarch64 and x86_64); PyPI's default build on macOS (MPS)
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
ai-models = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/ai_models", branch = "main" }
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
]
