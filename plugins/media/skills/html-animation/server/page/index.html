<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation Editor</title>
<link rel="stylesheet" href="/page/editor.css">
</head>
<body>
<header class="top">
  <h1 id="title">Animation</h1>
  <span id="folder" class="muted"></span>
  <span id="link" class="pill" title="Connection to the editor server">connecting</span>
</header>
<main class="layout">
  <section class="viewer">
    <div id="stage" class="stage">
      <iframe id="anim" sandbox="allow-scripts" title="Animation" src="about:blank"></iframe>
      <svg id="overlay" class="overlay" aria-label="Mark layer"></svg>
    </div>
    <div class="controls">
      <button id="play" type="button" class="button" title="Play or pause (space)">Play</button>
      <span id="time" class="time">0.00 / 0.00 s</span>
      <span id="chapter-now" class="muted"></span>
      <span id="hint" class="hint">Pause, then click a point or drag a rectangle on the frame.</span>
    </div>
    <div id="timeline" class="timeline">
      <div id="chapters" class="chapters"></div>
      <div id="markers" class="markers"></div>
      <input id="scrub" class="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Time">
    </div>
  </section>
  <aside class="side">
    <form id="compose" class="card">
      <h2>Comment</h2>
      <p id="mark-info" class="muted">No mark.</p>
      <p id="ids-info" class="ids"></p>
      <textarea id="message" rows="4" placeholder="What should change here?"></textarea>
      <div class="row">
        <button id="send" type="submit" class="button primary" disabled>Send</button>
        <button id="clear" type="button" class="button">Clear mark</button>
      </div>
      <p id="send-status" class="muted"></p>
    </form>
    <section class="card">
      <h2>Comments</h2>
      <ol id="comments" class="list"></ol>
    </section>
    <section class="card">
      <h2>Agent</h2>
      <ol id="messages" class="list"></ol>
    </section>
  </aside>
</main>
<script src="/page/editor.js"></script>
</body>
</html>
