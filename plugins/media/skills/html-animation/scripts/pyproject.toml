[project]
name = "html-animation-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # the plugin data directory and the settings file config.yaml (lib/plugin_settings, git source)
    "plugin-settings",
    # headless Chromium for still and stills
    "playwright==1.64.1",
    # the mark drawn on a still
    "Pillow>=10.1",
]

[tool.uv.sources]
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8",
]
