[project]
name = "batch-run-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
# pydantic is the only real dependency: the journal models use BaseModel.
# format_stream.py is stdlib-only (sys + json).
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = [
    "pytest>=8",
]

# uv takes its settings from the nearest pyproject.toml with a [tool.uv] table. This empty table stops that search
# here, so the settings of a project above (the repository root) never reach this project's lock.
[tool.uv]
