<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Studio</title>
<link rel="stylesheet" href="/static/studio.css">
<script src="/static/shell.js"></script>
<script src="/static/images.js"></script>
<script src="/static/videos.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="label">Studio</span><button class="fold" id="left-fold" type="button" title="Fold this column">«</button></div>
    <div class="nav" id="kinds"><h3>Make</h3></div>
    <div>
      <h3 id="projects-title">Projects</h3>
      <div id="projects"></div>
      <button class="project new" id="new-open" title="New project">+<span class="label">&nbsp;New project</span></button>
    </div>
    <div class="grow"></div>
    <div class="settings">
      <div class="pop" id="pop" hidden>
        <h4>Settings</h4>
        <label class="f">Appearance</label>
        <div id="theme"></div>
      </div>
      <button class="gear" id="gear" data-icon="settings" title="Settings"><span class="label">Settings</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="top" id="top" hidden>
      <h1 id="title"></h1><span class="tag" id="tag"></span>
      <div class="mode" id="mode" title="Step by step: each result is shown and waits for you. Automatic: the style is picked and everything made without waiting.">
        <button data-v="step">Step by step</button>
        <button data-v="auto">Automatic</button>
      </div>
      <button class="secondary danger" id="delete" title="Move this project to the Trash" hidden>Delete</button>
    </div>
    <div id="workspace"></div>
    <div class="actbar" id="actbar" hidden></div>
  </main>

  <aside class="activity">
    <div class="rail" id="rail" title="Unfold the Claude column">
      <span class="fold">«</span><span class="dot off" id="rail-dot"></span>
      <span class="rail-mark" id="rail-unread" title="A new answer" hidden>●</span>
      <span class="rail-mark ask" id="rail-ask" title="Waiting for your approval in Claude Code" hidden>!</span>
    </div>
    <header><span class="dot off" id="dot"></span><b>Claude</b><small id="state">connecting…</small><button class="fold" id="right-fold" type="button" title="Fold this column">»</button></header>
    <div class="feed" id="feed"></div>
    <div class="running" id="running" hidden></div>
    <div class="notice" id="asking" hidden></div>
    <div class="notice" id="queue" hidden></div>
    <div class="ask">
      <textarea id="ask" placeholder="Say what you want, in as much detail as you like."></textarea>
      <div class="bar"><span id="send-key">⌘ Enter to send</span><button class="primary" id="send">Send</button></div>
    </div>
  </aside>
  <div class="resize" id="left-resize" title="Drag to resize; double-click for the usual width"></div>
  <div class="resize right" id="right-resize" title="Drag to resize; double-click for the usual width"></div>
</div>

<div class="shade" id="shade" hidden>
  <div class="detail" id="detail">
    <div class="stage">
      <div class="tools">
        <button data-tool="view" data-icon="view">View</button>
        <button data-tool="box" data-icon="box">Box</button>
        <button data-tool="point" data-icon="point">Point</button>
        <button data-tool="loop" data-icon="loop">Circle freehand</button>
        <button id="d-clear">Clear marks</button>
        <span id="d-hint"></span>
      </div>
      <div class="canvas"><div class="frame" id="d-frame"><img id="d-img" alt=""><canvas id="d-overlay"></canvas></div></div>
    </div>
    <div class="info">
      <div class="head"><h2 id="d-title"></h2><button class="close" id="d-close" title="Close">×</button></div>
      <dl id="d-meta"></dl>
      <label class="f">Marked areas</label>
      <div class="marks" id="d-marks"></div>
      <label class="f" for="d-note">Anything else to change</label>
      <textarea id="d-note" placeholder="For example: make the sky darker"></textarea>
      <div class="acts" id="d-acts"></div>
    </div>
  </div>
</div>
<div class="banner" id="offline" hidden>Disconnected from the studio server. Reconnecting…</div>
</body>
</html>
