[project]
name = "studio-server"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
# Standard-library HTTP server; plugin-settings reads the studio and brand sections of config.yaml.
dependencies = [
    # the settings file config.yaml (lib/plugin_settings, git source)
    "plugin-settings",
    # the speech models of the voice picker and what each takes (lib/ai_models, git source)
    "ai-models",
]

[tool.uv.sources]
ai-models = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/ai_models", branch = "main" }
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8",
]
