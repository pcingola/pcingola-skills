[project]
name = "style-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
# The CLI writes references/index.md from the front matter of the style files.
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# uv takes its settings from the nearest pyproject.toml with a [tool.uv] table. This empty table stops that search
# here, so the settings of a project above (the repository root) never reach this project's lock.
[tool.uv]
