# Settings of the pcingola-skills marketplace: the models of the skills and every
# setting a skill reads. One file:
#     <config dir>/plugins/data/config.yaml
# <config dir> is $CLAUDE_CONFIG_DIR, else ~/.claude. SKILLS_CONFIG in the
# process environment names another file. The file holds API keys: chmod 600.
#
# Sections:
#     providers    where models run, with the key of each provider (api_key) and
#                  the attributes of its models (models)
#     tasks        the model of each task, as <provider name>:<model>
#     network      proxies and CA certificates
#     huggingface  the weights cache and token of the local diffusers models
#     brand        brand:brand and the Studio catalogue
#     studio       the Studio
#     voiceover    media:voiceover
#
# The whole file is validated when a skill starts: a misspelt section or key, a
# missing required key or a wrong type is an error naming its path. A section
# that holds only comments takes its defaults. Every key is optional unless its
# comment says "required". A variable exported in the shell is never a setting;
# CLAUDE_CONFIG_DIR, CLAUDE_PLUGIN_DATA and SKILLS_CONFIG come from the process
# environment only.


# === providers ===============================================================
# A model id is <provider name>:<model>; the first colon splits it, so
# ollama:d3:4b is the Ollama tag d3:4b.
#
# kind (required): ollama, openrouter, openai (any OpenAI-compatible server),
# azure (Azure OpenAI), google (Gemini, Lyria; vertex: true for a Vertex
# endpoint), diffusers (local models in process, GPU), vllm-omni (a local
# speech model served by vLLM-Omni), kokoro and chatterbox (local speech on the
# CPU), torchaudio (the word aligner of media:voiceover).
# timeout (seconds per request, default 600): the remote kinds, chatterbox and
# vllm-omni.
# Required keys: openrouter and azure need api_key; azure also base_url and
# api_version; openai needs api_key without base_url (the OpenAI API); google
# needs api_key, except a Vertex provider with Google Cloud credentials.
#
# models: the attributes of each model of the provider, by the model name after
# the colon. A remote provider serves any model id, and its entries only add
# attributes; a model of a local kind (diffusers, kokoro, torchaudio,
# chatterbox, vllm-omni) must have an entry. A speech model's entry takes voice
# (the default voice) and voices (the list `voiceover voices` shows).
# A task's model must be of a kind that serves the task (an image task takes
# an image model; tasks below).
#
# Delete the providers you do not use; replace each replace-me with a key.
# Without a GPU, also delete the local provider and the tasks that name local:
# a provider of kind diffusers makes the image-gen, music and short-video
# wrappers install PyTorch and diffusers.
# azure and vertex below point at a company (enterprise) gateway that serves
# Azure OpenAI and Vertex AI; for the services themselves, set base_url to the
# Azure resource or remove it for Vertex. Keys come only from this file:
# OPENAI_API_KEY, GOOGLE_API_KEY and the like in the shell are ignored.

providers:
  ollama:
    kind: ollama
    base_url: http://localhost:11434/v1
  openrouter:
    kind: openrouter
    api_key: sk-or-v1-replace-me
  azure:
    kind: azure
    base_url: https://gateway.example.com/azure-openai
    api_version: 2025-04-01-preview
    api_key: replace-me
    models:
      gpt-image-2:
        # media:image-gen request limits of this model, needed for a request
        # with a size, for an image model of an OpenAI kind (openai, azure,
        # openrouter, ollama): edges are multiples of 16; max_edge is the
        # longest edge (px), min_pixels and max_pixels the total pixel range
        # (all three required; these are gpt-image-2's).
        image:
          max_edge: 3840
          min_pixels: 655360
          max_pixels: 8294400
          always_sized: true      # every request gets a size (default 1:1, 1K)
          default_quality: high   # low | medium | high | auto, when --quality is not given
  vertex:
    kind: google
    vertex: true
    base_url: https://gateway.example.com/vertex-ai
    api_key: replace-me
    models:
      # predict: served by the Vertex predict endpoint (needs api_key); the
      # other music models stream.
      lyria-002: {predict: true}
      #gemini-2.5-pro-tts: {voice: Kore}
  # A Vertex provider takes Google Cloud credentials in place of api_key:
  # credentials (a service-account JSON file, must exist), else Application
  # Default Credentials, with project and location (default us-central1).
  #vertex_sa:
  #  kind: google
  #  vertex: true
  #  credentials: /path/to/service_account.json
  #  location: us-central1

  # Local models (kind diffusers). Each entry: repo (required, a Hugging Face
  # repository), steps, guidance (without it no guidance_scale is passed, for a
  # pipeline that has no such argument), args (a mapping of more pipeline call
  # arguments, after steps and guidance and before the caller's) and skip (a
  # list of pipeline components loaded as None, such as a text encoder the
  # model does not use). The keys of each role below make the entry a model of
  # that role; a key of another role is an error, and a task takes only a
  # model of its role (video, presenter, music; the image tasks an image model).
  # An image model (an entry with no key of another role) also has inpaint
  # (the diffusers pipeline class for edits with a mask) and image: max_edge
  # and min_edge (longest and shortest edge, px, both required), the
  # media:image-gen request limits.
  # A music model also has duration_arg (required) and lyrics_arg: the names
  # of the pipeline call arguments for the length in seconds and the lyrics (a
  # model without lyrics_arg takes no lyrics), and optionally min_crest_db: a
  # track whose crest factor (peak minus RMS where the music is loud, dB) is
  # below it is loud and compressed, and music generate sends the request again
  # with the next seed (--min-crest-db overrides it per call, 0 turns it off);
  # without it no check.
  # A video model also has, all required: pipeline (the diffusers class to
  # load), fps, size_multiple (width and height are rounded to it), frame_step
  # (frame counts are frame_step * k + 1), width, height (the default size) and
  # max_frames.
  # A presenter model also has, all required: pipeline (a DiffusionPipeline or
  # ModularPipeline class), fps, buckets (the frame sizes the model makes,
  # [width, height]; a clip takes the one nearest the picture's aspect ratio),
  # audio_rate (the sample rate the model takes the speech at) and output (the
  # pipeline output that holds the videos).
  # The first run downloads the weights to the Hugging Face cache
  # (huggingface.home below).
  local:
    kind: diffusers
    models:
      # FLUX.2 klein 4B, the default local image model; garbles text
      # (Qwen-Image spells it right).
      flux2-klein-4b:
        repo: black-forest-labs/FLUX.2-klein-4B
        steps: 4
        guidance: 1.0
        inpaint: Flux2KleinInpaintPipeline
        image: {max_edge: 2048, min_edge: 256}
      # Z-Image-Turbo, optional: no better than FLUX.2 klein in the photoreal,
      # illustration and text tests.
      #z-image-turbo:
      #  repo: Tongyi-MAI/Z-Image-Turbo
      #  steps: 9
      #  guidance: 0.0
      #  inpaint: ZImageInpaintPipeline
      #  image: {max_edge: 2048, min_edge: 256}
      # Qwen-Image 2.1, generation and edit (one pipeline, no guidance_scale).
      qwen-image:
        repo: Qwen/Qwen-Image-2.1
        steps: 40
        args: {output_resolution: 2048}
        image: {max_edge: 2048, min_edge: 256}
      # ACE-Step 1.5 XL SFT, the default music model.
      ace-step-sft:
        repo: ACE-Step/acestep-v15-xl-sft-diffusers
        steps: 50
        guidance: 7.0
        duration_arg: audio_duration
        lyrics_arg: lyrics
        min_crest_db: 10
      # ACE-Step 1.5 XL turbo, for tests and quick drafts; saturates: loud,
      # compressed sound (more steps do not change it). No min_crest_db: it is
      # chosen knowing that.
      ace-step:
        repo: ACE-Step/acestep-v15-xl-turbo-diffusers
        steps: 8
        guidance: 1.0
        duration_arg: audio_duration
        lyrics_arg: lyrics
      # LTX-Video 0.9.5 (2B), image to video; usable only for slow, near-static
      # motion (fast motion pixelates and deforms). LTX-2.5 is the default.
      ltx-video:
        repo: Lightricks/LTX-Video-0.9.5
        pipeline: LTXImageToVideoPipeline
        steps: 30
        guidance: 3.0
        fps: 24
        size_multiple: 32
        frame_step: 8
        width: 768
        height: 512
        max_frames: 121
      # LTX-2.5 distilled, image to video (gated: accept the license, set
      # huggingface.token). The args are the distilled schedule and guidance
      # off, from the model card.
      ltx-2.5:
        repo: Lightricks/LTX-2.5-Diffusers
        pipeline: LTX2ImageToVideoPipeline
        steps: 8
        guidance: 1.0
        fps: 24
        size_multiple: 32
        frame_step: 8
        width: 960
        height: 544
        max_frames: 481
        args:
          sigmas: [1.0, 0.99375, 0.9875, 0.98125, 0.975, 0.909375, 0.725, 0.421875]
          audio_guidance_scale: 1.0
          stg_scale: 0.0
          audio_stg_scale: 0.0
          modality_scale: 1.0
          audio_modality_scale: 1.0
        skip: [processor, prompt_enhancer]
      # Kandinsky 6.0 Pro distilled, text and image to video with a sound track;
      # 10 steps, guidance off (distilled).
      #kandinsky-6:
      #  repo: kandinskylab/Kandinsky-6.0-Pro-distill-5s-Diffusers
      #  pipeline: Kandinsky6TI2VAPipeline
      #  steps: 10
      #  guidance: 1.0
      #  fps: 24
      #  size_multiple: 32
      #  frame_step: 4
      #  width: 864
      #  height: 480
      #  max_frames: 121
      # Kandinsky S2V 1.0 Pro distilled, presenter (portrait and speech to
      # video, 5 s chunks); 16 steps, guidance distilled into the weights.
      kandinsky-s2v:
        repo: kandinskylab/Kandinsky-S2V-1.0-Pro-distill-Diffusers
        pipeline: KandinskyS2VDistilledModularPipeline
        steps: 16
        fps: 25
        buckets: [[512, 512], [512, 768], [768, 512]]
        audio_rate: 16000
        output: videos
      # Kandinsky S2V 1.0 Lite distilled (2B transformer), for tests.
      kandinsky-s2v-lite:
        repo: kandinskylab/Kandinsky-S2V-1.0-Lite-distill-Diffusers
        pipeline: KandinskyS2VDistilledModularPipeline
        steps: 16
        fps: 25
        buckets: [[512, 512], [512, 768], [768, 512]]
        audio_rate: 16000
        output: videos
      # LTX-Video 0.9.5 at small size and few steps, for tests.
      ltx-video-small:
        repo: Lightricks/LTX-Video-0.9.5
        pipeline: LTXImageToVideoPipeline
        steps: 8
        guidance: 3.0
        fps: 24
        size_multiple: 32
        frame_step: 8
        width: 512
        height: 320
        max_frames: 121

  # Kokoro 82M, local speech on the CPU in the skill's process (English US and
  # UK voices, no style). The provider's dir: where the model files go
  # (<dir>/<model>/); without it, media:voiceover keeps them in
  # <media data dir>/voiceover. Each model: model_url and voices_url
  # (required) are its files; langs (required) maps a voice-name prefix to its
  # espeak language (voices of other prefixes are refused); voice is the
  # default voice.
  kokoro:
    kind: kokoro
    models:
      kokoro-v1.0:
        model_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
        voices_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
        langs: {af_: en-us, am_: en-us, bf_: en-gb, bm_: en-gb}
        voice: af_heart
  # torchaudio forced-alignment pipelines (tasks.align): word times of
  # media:voiceover on the CPU. The model name is the pipeline's name in
  # torchaudio.pipelines; url (required): its weights file, downloaded to
  # <dir>/<model lowercased>/ (dir as for kokoro).
  torchaudio:
    kind: torchaudio
    models:
      MMS_FA:
        url: https://dl.fbaipublicfiles.com/mms/torchaudio/ctc_alignment_mling_uroman/model.pt
  # Chatterbox Turbo, local speech with voice cloning from one recording, on
  # the CPU, in a worker process of its own environment (chatterbox-tts pins
  # torch 2.6). The provider: python (required), the environment's
  # interpreter: media:voiceover's `setup --chatterbox` builds it under the
  # media data directory and prints it; dir as for kokoro; start_timeout:
  # seconds the load may take (default 600). Each model: url and files
  # (required), its files, downloaded to <dir>/<model>/. The voice default is
  # the model's built-in voice.
  #chatterbox:
  #  kind: chatterbox
  #  python: /path/to/env/bin/python
  #  models:
  #    chatterbox-turbo:
  #      url: https://www.modelscope.cn/models/ResembleAI/chatterbox-turbo/resolve/master
  #      files: [t3_turbo_v1.safetensors, s3gen_meanflow.safetensors, ve.safetensors, conds.pt, vocab.json, merges.txt, tokenizer_config.json, added_tokens.json, special_tokens_map.json]
  # Fish Audio Drama 3, local speech, served by vLLM-Omni from its own
  # environment (vllm-omni pins torch and transformers):
  #   uv venv <env dir> --python 3.12
  #   uv pip install --python <env dir>/bin/python "vllm==0.32.*" vllm-omni==0.32.0 --torch-backend=cu130
  # The provider: python (required); args: more server arguments (eager
  # loading: the default memory-mapped load is too slow on a unified-memory
  # GPU); env: server environment variables (FlashInfer's sampler needs nvcc
  # to JIT-compile on GPUs without prebuilt kernels); start_timeout: seconds
  # the start may take (default 1800). Each model: repo, deploy and memory
  # are required. The server's stages take memory GB together (Drama 3: over
  # 56; 70 leaves a 13 GB KV cache), and the server overhead GB more (default
  # 22). With less free, a start waits for local Ollama models that unload
  # within 15 min, else is refused and names what holds the memory. The
  # server stops after the command. style puts voiceover --style into the
  # text as inline tags.
  #fish:
  #  kind: vllm-omni
  #  python: /path/to/env/bin/python
  #  args: [--stage-init-timeout, 1800, --safetensors-load-strategy, eager]
  #  env: {VLLM_USE_FLASHINFER_SAMPLER: 0}
  #  models:
  #    drama-3:
  #      repo: fishaudio/drama-3
  #      deploy: fish_omni.yaml
  #      memory: 70
  #      style: "[{instructions}] {text}"


# === tasks ===================================================================
# The model of each task, <provider name>:<model>; its provider must be in
# providers, of a kind the task takes, and a model of a local kind in that
# provider's models. A key with no model is an error (remove it instead). The
# skills ask for these tasks, with the kinds each takes:
#   chat        ai:classify (chat backend), ai:second-opinion
#   vision      ai:second-opinion when an image is among the files
#   system1     ai:classify (system1 backend, System-1 models; the provider
#               needs base_url, default for ollama)
#   embed       embeddings (ai_models.models.embedder)
#   image       media:image-gen --tier fast (the default) without --ref:
#               quick drafts, bulk variations
#   image_edit  media:image-gen --tier fast with --ref
#   image_best  media:image-gen --tier best, with and without --ref: best
#               quality, text in the image (Studio "Best", the default tier
#               of media:video-effects)
#   image_multi_ref  media:image-gen --tier multi-ref, with and without --ref:
#               several reference images, a character or product kept the
#               same across images (Studio "Multi-reference")
#   speech      media:voiceover
#   align       media:voiceover word times (a forced aligner, kind torchaudio)
#   music       media:music generate
#   video       media:short-video video scenes (Engine: video): an image
#               animated into a clip
#   presenter   media:short-video presenter scenes (Engine: presenter): a
#               portrait and the scene's narration recording made into a clip
#               of the person speaking it
#   audio       media:music analyze (a chat model that takes audio)
#   film_critic media:short-video film critic, through ai:second-opinion (a
#               model that takes video with sound: a Gemini model of a
#               provider of kind google)
# Kinds: chat, vision, system1, embed, audio and film_critic take the remote
# kinds (ollama, openrouter, openai, azure, google); the image tasks those of
# OpenAI, google and diffusers; speech those and vllm-omni, kokoro,
# chatterbox; align torchaudio; music google and diffusers; video and
# presenter diffusers.
# A `--model <provider>:<model>` flag of a skill replaces the task's model; it
# is checked the same way.
tasks:
  chat: openrouter:google/gemini-3.1-pro-preview
  vision: ollama:gemma4:31b
  system1: ollama:d3:4b
  image: local:flux2-klein-4b
  image_edit: local:flux2-klein-4b
  image_best: azure:gpt-image-2
  image_multi_ref: azure:gpt-image-2
  speech: kokoro:kokoro-v1.0
  #speech: azure:gpt-4o-mini-tts
  align: torchaudio:MMS_FA
  music: local:ace-step-sft
  #music: vertex:lyria-002
  audio: vertex:gemini-3.1-pro-preview
  video: local:ltx-2.5
  film_critic: vertex:gemini-3.1-pro-preview
  # Local models on a GPU (Ollama and the local provider above), in place of
  # the cloud lines above:
  #speech: fish:drama-3
  #speech: chatterbox:chatterbox-turbo
  #image_best: local:qwen-image
  #image_edit: local:qwen-image
  #image_multi_ref: local:qwen-image
  #video: local:ltx-video
  #video: local:kandinsky-6
  #presenter: local:kandinsky-s2v
  # Small local models for the integration tests and a quick test film: real
  # models at small size and few steps, low quality output.
  #image: local:flux2-klein-4b
  #image_best: local:flux2-klein-4b
  #image_edit: local:flux2-klein-4b
  #image_multi_ref: local:flux2-klein-4b
  #speech: ollama:lfm3-audio   # tests only: odd, uncontrolled intonation, no style or speed
  #music: local:ace-step
  #video: local:ltx-video-small
  #presenter: local:kandinsky-s2v-lite


# === network =================================================================
# A skill that loads the settings sets these in its process environment, where
# the HTTP, TLS and Node.js libraries and child processes read them, and
# removes each one not set here (proxies also in lower case): a value exported
# in the shell has no effect.
network:
  # Proxies (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY). Read by the HTTP
  # clients of the model layer, its weight downloads included.
  #http_proxy: http://proxy.example.com:8080
  #https_proxy: http://proxy.example.com:8080
  #all_proxy: http://proxy.example.com:8080
  #no_proxy: [localhost, 127.0.0.1]
  # An extra CA certificate for TLS-intercepting proxies: export the proxy root
  # CA to a PEM file and name it here (the file must exist). Every remote call
  # of the model layer trusts it on top of certifi's roots (ai:classify,
  # ai:second-opinion, media:image-gen, media:music, media:voiceover), and it
  # is exported as NODE_EXTRA_CA_CERTS for Node.js programs. Chain and hostname
  # verification stay on.
  #extra_ca_cert: /path/to/proxy_root_ca.pem
  # A PEM bundle that replaces the default trust store (SSL_CERT_FILE; the file
  # must exist). The remote calls and weight downloads of the model layer do
  # not read it: they use certifi's roots plus extra_ca_cert.
  #ca_bundle: /path/to/ca_bundle.pem


# === huggingface =============================================================
huggingface:
  # Hugging Face cache (HF_HOME), where the local diffusers models
  # (media:image-gen, media:music, media:short-video) download their weights.
  # Default ~/.cache/huggingface.
  #home: /path/to/huggingface
  # Hugging Face token (HF_TOKEN). Needed only for a gated repository.
  #token: hf_replace-me


# === brand ===================================================================
brand:
  # Directories searched for brand folders (<dir>/<name>/brand.yaml) after the
  # bundled brands, in order; the first match wins. Missing directories are
  # skipped.
  #path: [/path/to/brands]


# === studio ==================================================================
studio:
  # Directory of the Studio projects: <dir>/<skill>/<project>/ (images,
  # infographic, slides, short-video). Absolute or starting with ~. Created when
  # missing. Default ~/Documents/Studio.
  #dir: ~/Documents/Studio
  # Your names, the default "Made by" of a new short video in the Studio.
  # Unset: films start with no author, and a film without an author has no
  # creator credit.
  #author: [Alice Example]


# === voiceover ===============================================================
voiceover:
  # Reference recordings written by `add-voice` (voices of the models that
  # clone one: chatterbox, vllm-omni). Default <media data dir>/voiceover/voices.
  #voices_dir: /path/to/voices
