[project]
name = "pptx-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-pptx",
    "Pillow",
    # the exit code of a SystemExit raised in process (lib/plugin_settings, git source)
    "plugin-settings",
]

[tool.uv.sources]
plugin-settings = { git = "https://github.com/pcingola/pcingola-skills", subdirectory = "lib/plugin_settings", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8",
]

# uv takes its settings from the nearest pyproject.toml with a [tool.uv] table. This empty table stops that search
# here, so the settings of a project above (the repository root) never reach this project's lock.
[tool.uv]
